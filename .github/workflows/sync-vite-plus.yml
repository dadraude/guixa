name: Sync Dependabot Vite+ aliases

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions: {}

concurrency:
  group: vite-plus-sync-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      # workflow_run uses the default branch's workflow and scripts, never PR code.
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Synchronize aliases and rerun CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/sync_vite_plus.py
