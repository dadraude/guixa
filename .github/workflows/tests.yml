name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, Windows]

    # Job services need a Linux runner, so Postgres runs through `docker run`
    # on a non-default port to stay clear of any local Postgres.
    env:
      PG_CONTAINER: guixa-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 55432
      DB_DATABASE: guixa_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Start Postgres
        run: |
          docker run -d --name $env:PG_CONTAINER `
            -e POSTGRES_USER=postgres `
            -e POSTGRES_PASSWORD=postgres `
            -e POSTGRES_DB=guixa_test `
            -p "${env:DB_PORT}:5432" `
            postgres:17
          if ($LASTEXITCODE -ne 0) { exit 1 }
          for ($i = 0; $i -lt 30; $i++) {
            docker exec $env:PG_CONTAINER pg_isready -h 127.0.0.1 -U postgres
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Stop Postgres
        if: always()
        run: docker rm -f $env:PG_CONTAINER
